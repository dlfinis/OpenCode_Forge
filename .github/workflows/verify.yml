name: Verify compatibility

# Cross-version compatibility is checked here, not on a developer machine: every
# verifier target downloads a full IDE distribution (1.5 GB+ each).
#
# No `schedule` trigger: GitHub disables scheduled workflows on forked
# repositories, and a workflow carrying one fails to start on dispatch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'src/main/**'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify against the supported IDE range
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the plugin archive
        run: ./gradlew buildPlugin --console=plain

      - name: Verify against every supported IDE
        run: ./gradlew verifyPlugin -PverifyAllIdes --console=plain

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: build/reports/pluginVerifier/**
          if-no-files-found: ignore
          retention-days: 30
