name: Verify compatibility

# Static compatibility check against an IDE's API surface: it reports classes and
# methods that no longer exist, without running the plugin.
#
# On demand only. Each verifier target downloads a full IDE distribution (1.5 GB+),
# so this never runs automatically on a push. Nothing is downloaded on a developer
# machine: the archive lands on the ephemeral runner and is discarded with it.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'IDE version to verify against (e.g. 2026.3)'
        required: true
        default: '2026.3'

permissions:
  contents: read

jobs:
  verify:
    name: Verify against IntelliJ IDEA ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the plugin archive
        run: ./gradlew buildPlugin --console=plain

      - name: Verify the plugin
        run: ./gradlew verifyPlugin -PverifyTarget=${{ inputs.target }} --console=plain

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-report-${{ inputs.target }}
          path: build/reports/pluginVerifier/**
          if-no-files-found: ignore
          retention-days: 30
