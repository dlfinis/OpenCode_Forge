# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# The IntelliJ Platform provides the Kotlin stdlib. Adding a second copy from the
# Kotlin Gradle plugin risks ClassNotFoundException or a version mismatch at
# runtime, and `verifyPluginProjectConfiguration` reports it as a configuration
# issue. Kotlin is pinned in build.gradle.kts to the version the target platform
# ships, so the platform copy is the only one that should exist.
kotlin.stdlib.default.dependency=false
